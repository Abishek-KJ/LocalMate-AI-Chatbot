spring.application.name=demo
server.port=${SERVER_PORT:8080}

# Set DB_PASSWORD before starting the application. These defaults target a local MySQL setup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3310/ai_chatbot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.sql.init.mode=always

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b}
